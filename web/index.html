<!doctype html>
<!-- 9RouterX — source port and modifications by https://github.com/yanstd888/ — https://t.me/aiclub_id -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:image" content="/android-chrome-512x512.png" />
    <meta property="og:image:alt" content="9RouterX logo" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="9RouterX" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>9RouterX - High-Throughput AI Gateway</title>
    <!--
      Early theme application: dark is the compiled default (class above), so a
      stored light preference must drop .dark before first paint or the page
      flashes dark. The TopBar toggle re-applies the same classes when it
      mounts; this only bridges the gap. Theme colors must match --9x-bg in
      web/src/index.css (dark #0e0f11 / light #f6f6f3).
    -->
    <script>
      try {
        var t =
          localStorage.getItem('9routerx-theme') || localStorage.getItem('theme')
        if (t === 'light') {
          document.documentElement.classList.remove('dark')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#f6f6f3')
        }
      } catch (e) {}
    </script>
  </head>
  <!-- Colors come from the body rule in index.css (var(--app-bg) /
       var(--app-text-main)), which follows the theme; no dark-only
       hardcodes here or light mode keeps a dark island. -->
  <body class="font-sans antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
