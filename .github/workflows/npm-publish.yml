# 9RouterX npm distribution (TASK-9routerX-updater-B §3).
# Platform binaries are wrapped as scoped packages under the maintainer's npm
# account (scope resolved at publish time via `npm whoami` — unscoped
# dash-heavy names trigger npm's spam detection). The main `9routerx` wrapper
# declares them as optionalDependencies (the esbuild/turbo pattern — no
# postinstall downloads) and its launcher resolves the right one at runtime.
# NODE_AUTH_TOKEN comes from the repo secret (granular token, no OTP).
name: npm-publish

# Fires on release publication (the release workflow attaches the binaries
# first — publishing in parallel raced the asset upload). Manual dispatch for
# re-runs against an existing tag's release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, ext: .exe, npm_os: win32, npm_arch: x64 }
          - { os: linux, arch: amd64, ext: '', npm_os: linux, npm_arch: x64 }
          - { os: linux, arch: arm64, ext: '', npm_os: linux, npm_arch: arm64 }
          - { os: darwin, arch: amd64, ext: '', npm_os: darwin, npm_arch: x64 }
          - { os: darwin, arch: arm64, ext: '', npm_os: darwin, npm_arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Download release binary for this platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --pattern "9routerx-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}*" --clobber
          ls -la
      - name: Assemble platform package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          SCOPE="$(npm whoami)"
          PKGDIR="pkg/@${SCOPE}/9routerx-${{ matrix.npm_os }}-${{ matrix.npm_arch }}"
          mkdir -p "${PKGDIR}/bin"
          BIN="9routerx${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            cp "9routerx-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" "${PKGDIR}/bin/${BIN}"
          else
            chmod +x "9routerx-${{ matrix.os }}-${{ matrix.arch }}"
            cp "9routerx-${{ matrix.os }}-${{ matrix.arch }}" "${PKGDIR}/bin/${BIN}"
          fi
          SCOPE="${SCOPE}" node -e "
            const p = { name: '@' + process.env.SCOPE + '/9routerx-${{ matrix.npm_os }}-${{ matrix.npm_arch }}', version: process.env.VERSION, description: '9RouterX binary (${{ matrix.os }}/${{ matrix.arch }})', os: ['${{ matrix.npm_os }}'], cpu: ['${{ matrix.npm_arch }}'], license: 'MIT', repository: { type: 'git', url: 'git+https://github.com/yanstd888/9routerx.git' }, author: 'Muhammad Dian (yanstd888)', files: ['bin'], publishConfig: { access: 'public' } };
            require('fs').writeFileSync('${PKGDIR}/package.json', JSON.stringify(p, null, 2));
          "
      - name: Publish platform package
        if: ${{ secrets.NODE_AUTH_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          cd "pkg/@$(npm whoami)/9routerx-${{ matrix.npm_os }}-${{ matrix.npm_arch }}"
          npm publish --dry-run
          npm publish --access public

  wrapper:
    needs: platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Assemble + publish main wrapper package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          SCOPE="$(npm whoami)"
          mkdir -p pkg/9routerx/bin
          SCOPE="${SCOPE}" VERSION="${VERSION}" node -e "
            const scope = process.env.SCOPE;
            const v = process.env.VERSION;
            const plat = (os, a) => '@' + scope + '/9routerx-' + os + '-' + a;
            const p = { name: '9routerx', version: v, description: '9RouterX — 9R Next Go Generation: local AI gateway (installs the right platform binary)', bin: { 9routerx: 'bin/launcher.js' }, optionalDependencies: { [plat('win32','x64')]: v, [plat('linux','x64')]: v, [plat('linux','arm64')]: v, [plat('darwin','x64')]: v, [plat('darwin','arm64')]: v }, license: 'MIT', repository: { type: 'git', url: 'git+https://github.com/yanstd888/9routerx.git' }, author: 'Muhammad Dian (yanstd888)', keywords: ['ai','gateway','router','llm','proxy'], engines: { node: '>=18' }, publishConfig: { access: 'public' } };
            require('fs').writeFileSync('pkg/9routerx/package.json', JSON.stringify(p, null, 2));
            const fs = require('fs');
            fs.writeFileSync('pkg/9routerx/bin/launcher.js', [
              '#!/usr/bin/env node',
              \"const { platform, arch } = process;\",
              \"const map = { win32: { x64: 'win32-x64', arm64: 'win32-arm64' }, linux: { x64: 'linux-x64', arm64: 'linux-arm64' }, darwin: { x64: 'darwin-x64', arm64: 'darwin-arm64' } };\",
              \"const t = (map[platform] || {})[arch];\",
              \"if (!t) { console.error('9RouterX: unsupported platform ' + platform + '/' + arch); process.exit(1); }\",
              \"const ext = platform === 'win32' ? '.exe' : '';\",
              \"const { spawnSync } = require('child_process');\",
              \"const r = spawnSync(require.resolve('\" + '@' + scope + \"/' + '9routerx-' + t + '/bin/9routerx' + ext), process.argv.slice(2), { stdio: 'inherit' });\",
              \"process.exit(r.status || 0);\",
              ''
            ].join('\n'));
          "
          cd pkg/9routerx
          npm publish --dry-run
          npm publish --access public
