# 9RouterX — derived from the work of https://github.com/yanstd888/ — port and modifications by the maintainers — https://t.me/aiclub_id
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  # Docker Hub repository — the OPTIONAL bonus channel. The primary container
  # channel is GHCR (ghcr.io/<owner>/9routerx, pushed with the built-in
  # GITHUB_TOKEN, no secrets). The image moved with the 9RouterX rebrand from
  # the fork's luqmenul/9routerx to the owner's yanstd888/9routerx; the push
  # below is best-effort and never reddens the workflow.
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/9routerx

jobs:
  # The release channel is derived from the tag and nothing else — not the
  # branch, not the commit, not an input. That keeps the switch auditable: what
  # you tag is what you publish.
  #
  #   stable       v1.10.0        -> GitHub Release (final)
  #                                  docker :latest :1.10 :1.10.0
  #   experimental v1.10.0-exp.1  -> GitHub Release (PRERELEASE)
  #                                  docker :exp :1.10-exp :1.10.0-exp.1
  #
  # Both halves matter for user safety. GitHub excludes prereleases from
  # /releases/latest, which is the endpoint `internal/updater` falls back to,
  # so a stable install is never offered an experimental build. And
  # `docker/metadata-action`'s `type=raw,value=latest,enable={{is_default_branch}}`
  # was permanently false here — this workflow only ever runs on tags — which is
  # why :latest had never moved at all. Both are replaced by the explicit
  # per-channel tag lists computed below.
  channel:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: Resolve release channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      docker_tags: ${{ steps.resolve.outputs.docker_tags }}
      has_dockerhub: ${{ steps.dockerhub.outputs.has }}
    steps:
      - uses: actions/checkout@v4

      # Secrets cannot be referenced from an `if` condition — GitHub rejects the
      # whole workflow file at load time ("Unrecognized named-value: 'secrets'",
      # which turned every push into a 0-second run with no jobs). Credential
      # presence is therefore probed here, where an `env:` block may read
      # secrets, and the docker job gates on this output in its own job-level
      # `if` (the `needs` context IS allowed there).
      - name: Probe Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not configured; the docker job will be skipped."
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve channel and verify version sources
        id: resolve
        run: |
          set -euo pipefail
          # A manual dispatch has no tag, so VERSION is the only version there
          # is and the tag-vs-file check below is skipped rather than faked.
          if [ "${GITHUB_REF_TYPE:-tag}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            FILE_VERSION="$(cat VERSION)"
            # make cross and the Dockerfile both embed the VERSION file, so a
            # mismatched tag would publish binaries that report themselves as
            # $FILE_VERSION while the release is titled $TAG.
            if [ "$FILE_VERSION" != "$VERSION" ]; then
              echo "::error::VERSION ($FILE_VERSION) does not match tag $TAG."
              echo "The release would ship binaries reporting the wrong version."
              echo "  ./scripts/bump-version.sh $VERSION   # then re-tag"
              exit 1
            fi
          else
            VERSION="$(cat VERSION)"
          fi

          MANIFEST_VERSION="$(grep -o '"latestVersion": *"[^"]*"' version.json | cut -d'"' -f4)"
          if [ -z "$MANIFEST_VERSION" ]; then
            echo "::error::could not read latestVersion out of version.json"
            exit 1
          fi
          case "$VERSION" in
            *-*)
              CHANNEL=experimental
              PRERELEASE=true
              # version.json is the manifest `9routerx update` polls from the
              # main branch, and checkManifest offers whatever it names. An
              # experimental version sitting in it is pushed to every install,
              # so this has to fail the release rather than warn.
              if [ "$MANIFEST_VERSION" = "$VERSION" ]; then
                echo "::error::version.json advertises $VERSION to every install."
                echo "version.json is the stable manifest; experimental builds must"
                echo "not appear there. Restore it to the latest stable release:"
                echo "  ./scripts/bump-version.sh <latest-stable>"
                exit 1
              fi
              # `%%-*` removes the longest suffix starting at the first dash,
              # so the core survives regardless of how many dashes the
              # prerelease identifier has; `%.*` then drops the patch. The
              # result is the floating tag the matching stable release takes.
              CORE="${VERSION%%-*}"
              TAGS="exp ${CORE%.*}-exp $VERSION"
              ;;
            *)
              CHANNEL=stable
              PRERELEASE=false
              # The mirror image: publishing a stable release without bumping
              # the manifest leaves every existing install reporting "up to
              # date" against the previous version, silently.
              if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
                echo "::error::version.json advertises $MANIFEST_VERSION but this tag"
                echo "is $VERSION. The manifest is what users are offered as an"
                echo "update, so the release would go out without reaching anyone."
                echo "  ./scripts/bump-version.sh $VERSION"
                exit 1
              fi
              TAGS="latest ${VERSION%.*} $VERSION"
              ;;
          esac

          {
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "docker_tags<<EOF"
            for t in $TAGS; do echo "type=raw,value=$t"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "channel:  $CHANNEL"
          echo "version:  $VERSION"
          echo "docker:   $TAGS"

  binaries:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: Build release binaries
    needs: channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build Web SPA
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Warm the module cache (retried)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download all; then
              echo "module graph cached on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::go mod download failed 3 times; the proxy is unreachable."
              exit 1
            fi
            echo "attempt ${attempt} failed (transient proxy error); retrying in 5s"
            sleep 5
          done

      - name: Build all platforms
        run: make cross

      - name: Generate changelog
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/## \\[$TAG\\]/{flag=1; next} /## \\[v/{flag=0} flag" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            # No section named after the tag. Fall back to [Unreleased] before
            # the git log: writing up an experimental build in [Unreleased]
            # and tagging it is the normal way this repo works, and a list of
            # commit subjects is the worst possible release page for the build
            # people are being asked to help test. The git log stays as the
            # last resort, for a tag with neither.
            if [ -f CHANGELOG.md ]; then
              NOTES=$(awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)
            fi
          fi
          if [ -z "$NOTES" ]; then
            # Per-PR fragments in .changes/ are the pending changelog (§7.6 of
            # AGENTS.md). They are the fallback between the curated sections and
            # the commit log because they carry the written explanation a release
            # page needs, and because most tags are pushed without anyone running
            # `make changelog-merge` first — which, before this step existed,
            # meant a release page of bare commit subjects.
            #
            # Newest first, matching what the dashboard renders. The PR number is
            # pulled out as a bare integer before sorting: `sort -k1,1n` on
            # `900-z` treats the field as text and interleaves 88 and 1000
            # anyway, so the order would disagree with the changelog modal.
            #
            # Written without `ls | grep` or an unquoted command substitution:
            # both were shellcheck findings (SC2010, SC2046) that would fail
            # actionlint once it runs with shellcheck present, and the glob with
            # a `continue` is the form that also survives a filename containing
            # a space. The output is byte-identical to what the old pipeline
            # produced — verified against this repo's fragments.
            if compgen -G ".changes/*.md" > /dev/null; then
              ORDERED=$(for f in .changes/*.md; do
                if [ "$(basename "$f")" = "README.md" ]; then continue; fi
                printf '%s %s\n' "$(basename "$f" .md | cut -d- -f1)" "$f"
              done | sort -rn | cut -d' ' -f2-)
              NOTES=$(while IFS= read -r f; do
                if [ -n "$f" ]; then cat "$f"; fi
              done <<< "$ORDERED")
            fi
          fi
          if [ -z "$NOTES" ]; then
            # Last resort: the commit log. `grep '^v'` finds nothing before the
            # first tagged release, and under `set -euo pipefail` that empty
            # result aborted the whole step — a missing CHANGELOG.md took the
            # release down instead of degrading to commit subjects.
            PREV_TAG=$(git tag --sort=-version:refname | { grep '^v' || true; } | head -2 | tail -1)
            if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG" ]; then
              LOG=$(git log --pretty=format:"- %s (%h)" --no-merges || true)
            else
              # The range needs both refs to resolve; a tag deleted or never
              # fetched would otherwise abort the release for its notes.
              LOG=$(git log --pretty=format:"- %s (%h)" --no-merges "${PREV_TAG}..${TAG}" 2>/dev/null || true)
              if [ -z "$LOG" ]; then
                LOG=$(git log --pretty=format:"- %s (%h)" --no-merges || true)
              fi
            fi
            NOTES="$LOG"
          fi
          if [ "${{ needs.channel.outputs.prerelease }}" = "true" ]; then
            # The banner is the first thing a reader sees on the release page,
            # so it states the two things that actually differ from a stable
            # release: it is not on `latest`, and the updater will not offer it
            # to an install already running a stable version.
            #
            # Everything below keeps this step's indentation on purpose.
            # `run: |` strips the block's common leading indentation, and a
            # line flush against column 0 would make that indentation zero for
            # the whole script. The heredoc terminator only looks unindented
            # after GitHub removes the common prefix.
            cat > /tmp/notes.md <<BANNER
          > **Experimental build.** Not published to \`latest\`, and \`9routerx update\`
          > will not offer it to an install running a stable release. Track it
          > explicitly:
          >
          > \`\`\`sh
          > docker pull ghcr.io/${{ github.repository_owner }}/9routerx:${GITHUB_REF_NAME#v}
          > \`\`\`
          >
          > Issues found here are still worth reporting — but check the stable
          > release first, because experimental breakage is usually already
          > fixed by the next tagged build.

          BANNER
          else
            echo "" > /tmp/notes.md
          fi
          printf '%s\n' "$NOTES" >> /tmp/notes.md
          cat /tmp/notes.md

      # The notify job runs on its own runner, where /tmp/notes.md does not
      # exist. An artifact carries the exact text the release page was built
      # from, so the Telegram message cannot drift from what users actually
      # read — regenerating the notes in a second job would duplicate the
      # 40-line fallback chain and let the two answers disagree.
      - name: Share release notes with the notify job
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: /tmp/notes.md
          retention-days: 1
          if-no-files-found: error

      # Asset names stay 9routerx-* on purpose: `make cross` builds
      # CROSS_BIN=9routerx, install.sh/install.ps1 download those asset
      # names, and the updater's archive scoring matches them. The in-repo
      # rename to 9routerx only changed the local dev binary (BINARY_NAME) and
      # the installed file name — not the published release artifacts.
      - name: Upload binaries to release
        # Manual dispatches from main have no tag: skip the release upload
        # (binaries are still built as the CI proof); tag runs upload as usual.
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          # What marks the GitHub Release itself as experimental, which is what
          # keeps it out of /releases/latest. The YAML value must be a real
          # boolean, so it is compared here rather than passed through the
          # string output of the channel job.
          prerelease: ${{ needs.channel.outputs.prerelease == 'true' }}
          files: |
            9routerx-linux-amd64
            9routerx-linux-arm64
            9routerx-darwin-amd64
            9routerx-darwin-arm64
            9routerx-windows-amd64.exe
            9routerx-tray-windows-amd64.exe
            SHA256SUMS.txt
          body_path: /tmp/notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # version.json on main is the manifest every install polls
      # (raw.githubusercontent.com/<owner>/9routerx/main/version.json). Since
      # #72 made the digest mandatory, a manifest without one is a dead end:
      # CheckUpdate refuses to answer from it whenever it advertises an update,
      # and the install then rides on the Releases API fallback — which returned
      # HTTP 500 for some users on v1.1.0, leaving "manifest error (manifest
      # carries no sha256 ...), github releases error (github releases HTTP 500)".
      # The digests cannot exist before the binaries do, so bump-version.sh can
      # never write them; this step computes them from the SHA256SUMS.txt the
      # cross target just produced and pushes the per-platform sha256s /
      # downloadUrls into version.json on main.
      #
      # Stable tags only. version.json is the stable manifest: for an
      # experimental tag bump-version.sh leaves it advertising the last stable
      # release, and publishing exp digests here would pair them with a
      # latestVersion the updater would then offer to every install.
      - name: Publish update manifest (sha256 per platform)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.channel.outputs.prerelease == 'false' }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"

          # SHA256SUMS.txt lines are "<digest><2 spaces><name>" (sha256sum's
          # text-mode separator). Split on the two spaces rather than on any
          # whitespace so the binary-mode " *name" variant would still parse.
          SUMS_ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            digest="${line%%  *}"
            name="${line##*  }"
            case "$name" in
              9routerx-linux-amd64|9routerx-linux-arm64|9routerx-darwin-amd64|9routerx-darwin-arm64|9routerx-windows-amd64.exe)
                # The manifest digest is what PerformSelfUpdate verifies the
                # downloaded asset against; anything shorter than 64 lowercase
                # hex chars would verify nothing.
                if ! printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'; then
                  echo "::error::SHA256SUMS.txt has a malformed digest for $name: $digest"
                  exit 1
                fi
                SUMS_ARGS+=("$name" "$digest")
                ;;
            esac
          done < SHA256SUMS.txt
          if [ "${#SUMS_ARGS[@]}" -ne 10 ]; then
            echo "::error::expected 5 binary assets in SHA256SUMS.txt, found $(( ${#SUMS_ARGS[@]} / 2 ))"
            exit 1
          fi
          SHA256S_JSON=$(jq -n --args '$ARGS.positional as $a | reduce range(0; ($a|length); 2) as $i ({}; .[$a[$i]] = $a[$i+1])' "${SUMS_ARGS[@]}")

          # downloadUrls uses the same "<goos>_<goarch>" keys the updater looks
          # up (checkManifest), so a manifest install downloads the real asset
          # instead of the releases/latest page the flat downloadUrl holds.
          DOWNLOAD_URLS_JSON=$(jq -n --arg base "$ASSET_BASE" '{
            linux_amd64:   ($base + "9routerx-linux-amd64"),
            linux_arm64:   ($base + "9routerx-linux-arm64"),
            darwin_amd64:  ($base + "9routerx-darwin-amd64"),
            darwin_arm64:  ($base + "9routerx-darwin-arm64"),
            windows_amd64: ($base + "9routerx-windows-amd64.exe")
          }')

          jq -n \
            --arg latestVersion "$VERSION" \
            --arg downloadUrl "$(jq -r '.downloadUrl // ""' version.json)" \
            --argjson downloadUrls "$DOWNLOAD_URLS_JSON" \
            --argjson sha256s "$SHA256S_JSON" \
            --rawfile releaseNotes /tmp/notes.md \
            --arg releaseUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{latestVersion: $latestVersion,
              downloadUrl: $downloadUrl,
              downloadUrls: $downloadUrls,
              sha256s: $sha256s,
              releaseNotes: $releaseNotes,
              releaseUrl: $releaseUrl,
              publishedAt: $publishedAt}' > /tmp/version.json

          # One missing digest would reintroduce the dead end this step exists
          # to close, so the manifest is verified before it leaves the runner.
          if [ "$(jq -r '.sha256s | length' /tmp/version.json)" -ne 5 ]; then
            echo "::error::built manifest does not carry 5 sha256 entries"
            exit 1
          fi

          # The tag keeps its own (digest-less) version.json — that is fine,
          # installs poll main. The checkout is detached at the tag, so the
          # commit is built on origin/main and pushed with a retry in case main
          # moved while this release was building.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publish-manifest FETCH_HEAD
            cp /tmp/version.json version.json
            if git diff --quiet HEAD -- version.json; then
              echo "manifest on main already current; nothing to publish"
              exit 0
            fi
            git add version.json
            git commit -m "release: publish v$VERSION update manifest (sha256 per platform)"
            if git push origin HEAD:main; then
              echo "update manifest published to main"
              exit 0
            fi
            echo "push rejected (main moved mid-release); retrying"
            sleep 5
          done
          echo "::error::could not push the update manifest to main after 3 attempts"
          exit 1

  docker:
    # GHCR is the primary container channel (upstream decolua/9router parity:
    # ghcr.io/<owner>/9routerx). It needs no secrets — the built-in GITHUB_TOKEN
    # plus `permissions: packages: write` below always suffice, so the job is
    # gated on the tag only, never on the has_dockerhub probe. The Docker Hub
    # push survives as an optional bonus behind that probe, and every bonus
    # step carries continue-on-error: true — a Hub outage or a revoked token
    # must not turn a release red now that the mandatory channel is GHCR.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: Build and push Docker image
    needs: channel
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The owner expression keeps the path honest: ghcr.io/yanstd888/9routerx,
      # never a hard-coded username and never a doubled owner prefix
      # (metadata-action leaves a fully-qualified image reference as-is).
      - name: Extract metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/9routerx
          tags: ${{ needs.channel.outputs.docker_tags }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Optional Docker Hub bonus: everything below may fail ----

      - name: Log in to Docker Hub (optional bonus)
        id: hub_login
        if: needs.channel.outputs.has_dockerhub == 'true'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Hub metadata (optional bonus)
        id: meta_hub
        if: needs.channel.outputs.has_dockerhub == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: ${{ needs.channel.outputs.docker_tags }}

      # Gated on the login outcome too: a failed Hub login should not buy a
      # second multi-arch build that can only fail at the push.
      - name: Build and push (Docker Hub, optional bonus)
        if: needs.channel.outputs.has_dockerhub == 'true' && steps.hub_login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_hub.outputs.tags }}
          labels: ${{ steps.meta_hub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Announce the release to the Telegram group.
  #
  # `needs: [binaries, docker]` is the whole design: it runs only after the
  # release page and the image both exist, so the link in the message resolves.
  # A separate workflow triggered by the tag push would fire in parallel with
  # the build and routinely publish a 404 link.
  #
  # continue-on-error is deliberate. A Telegram outage or a revoked token must
  # not turn a successful release red — the artifacts are already published by
  # this point, and a failed job here reads as "the release failed" to anyone
  # watching the run list.
  notify:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: Notify Telegram
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: /tmp

      - name: Send release notification
        run: bash scripts/notify-telegram.sh --tag "${GITHUB_REF_NAME}" --notes /tmp/notes.md
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
